<div>
  <h1 class="page-title">Transferência</h1>
  <p class="page-subtitle">Transfira valores entre benefícios com segurança.</p>
</div>

<div class="card">
  <div *ngIf="erro" class="alert alert-error">
    {{ erro }}
  </div>

  <div *ngIf="sucesso" class="alert alert-success">
    {{ sucesso }}
  </div>

  <form [formGroup]="form" (ngSubmit)="transferir()">
    <div class="form-grid">
      <div class="form-group">
        <label for="fromId">ID origem</label>
        <input id="fromId" class="input" type="number" formControlName="fromId" placeholder="Ex: 1" />
      </div>

      <div class="form-group">
        <label for="toId">ID destino</label>
        <input id="toId" class="input" type="number" formControlName="toId" placeholder="Ex: 2" />
      </div>

      <div class="form-group full">
        <label for="amount">Valor da transferência</label>
        <input id="amount" class="input" type="number" step="0.01" formControlName="amount" placeholder="0,00" />
      </div>
    </div>

    <div class="form-actions">
      <button class="btn btn-success" type="submit" [disabled]="processando">
        {{ processando ? 'Processando...' : 'Transferir' }}
      </button>
      <button class="btn btn-secondary" type="button" (click)="voltar()" [disabled]="processando">
        Voltar
      </button>
    </div>
  </form>

  <div class="loading-block" *ngIf="processando">
    <div class="spinner"></div>
    <div class="loading-text">Processando transferência...</div>
  </div>
</div>
